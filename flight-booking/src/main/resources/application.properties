#
spring.ai.dashscope.api-key=${TULING_AI_API_KEY}
spring.ai.dashscope.chat.options.model= qwen-plus
spring.ai.dashscope.chat.options.temperature=0.5


spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.embedding.model=nomic-embed-text:latest
spring.ai.ollama.chat.options.temperature=1.0



# 由于spring ai alibaba 还未更新2.0    所以使用deepseek的api可以兼容
spring.ai.deepseek.api-key=${TULING_AI_API_KEY}
spring.ai.deepseek.chat.model= qwen3.7-max
spring.ai.deepseek.chat.base-url= https://ws-eqnfwmeu6ckde86m.cn-beijing.maas.aliyuncs.com/compatible-mode/v1


# 由于spring ai alibaba 还未更新2.0    所以使用openai的api可以兼容
spring.ai.openai.embedding.api-key=${TULING_AI_API_KEY}
spring.ai.openai.embedding.base-url= https://ws-eqnfwmeu6ckde86m.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
spring.ai.openai.embedding.model= qwen3.7-text-embedding
spring.ai.openai.chat.api-key=${TULING_AI_API_KEY}
spring.ai.openai.audio.speech.api-key=${TULING_AI_API_KEY}
spring.ai.openai.audio.transcription.api-key=${TULING_AI_API_KEY}
spring.ai.openai.image.api-key=${TULING_AI_API_KEY}
spring.ai.openai.moderation.api-key=${TULING_AI_API_KEY}



agent.memory.dir=${user.home}/.agents/memory
agent.skills.dirs=classpath:/.agents/skills

logging.level.org.springframework.ai.chat.client.advisor= DEBUG
